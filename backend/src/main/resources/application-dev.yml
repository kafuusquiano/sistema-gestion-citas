# Perfil de desarrollo local.
# PostgreSQL y MongoDB instalados nativos en Windows. Sin Docker, sin Kafka.
# La cache usa Caffeine en memoria: no hay Redis nativo para Windows.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_citas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/gestion_citas}

  cache:
    type: caffeine

  mail:
    # Mailtrap captura los correos en la nube; no se envia nada a destinatarios reales
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

management:
  endpoint:
    health:
      # En dev conviene ver que componente esta caido; en prod queda oculto
      show-details: always
  health:
    redis:
      # En dev no hay Redis: la cache es Caffeine. Sin esto el health sale DOWN.
      enabled: false
    mail:
      # Volver a true cuando MAIL_USERNAME y MAIL_PASSWORD de Mailtrap esten en .env
      enabled: false

logging:
  level:
    com.proyecto.gestioncitas: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    # Clave solo de desarrollo. En prod llega por variable de entorno (instruccion G5).
    secret: ${JWT_SECRET:clave-de-desarrollo-no-usar-en-produccion-minimo-64-caracteres-aqui}
