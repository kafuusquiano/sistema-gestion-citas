# Configuracion comun a todos los perfiles.
# El perfil activo se elige con SPRING_PROFILES_ACTIVE (dev en local, prod en Render).
spring:
  application:
    name: gestion-citas
  profiles:
    default: dev

  config:
    # Spring Boot no lee archivos .env por su cuenta, pero si puede importar un
    # .properties, y un .env con pares CLAVE=valor es sintaxis .properties valida.
    # Las dos rutas cubren arrancar desde backend/ o desde la raiz del repo.
    # optional: hace que no falle en Render, donde las variables vienen del panel.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea Flyway, nunca Hibernate. validate falla si el esquema no coincide.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    # Nunca exponer el stack trace al cliente (instruccion G4)
    include-stacktrace: never
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Propiedades propias del sistema
app:
  zona-horaria: America/Lima
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-ms: ${JWT_REFRESH_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
