name: CI

# Corre en cada push y en cada pull request sobre las ramas principales.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # PostgreSQL como servicio del propio runner. Es lo que permite
    # ejecutar las pruebas de integracion sin Testcontainers y sin Docker
    # en el equipo de desarrollo.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_citas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar y probar
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://localhost:5432/gestion_citas_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: clave-de-integracion-continua-con-mas-de-sesenta-y-cuatro-caracteres-xx
        run: mvn -B -ntp verify

      - name: Construir la imagen
        # Verifica el Dockerfile aqui y no en el despliegue: si tiene un
        # error, se descubre en el runner y no cuando Render ya intento
        # publicar.
        working-directory: backend
        run: docker build -t gestion-citas:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Se omite mientras el frontend no tenga codigo.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
